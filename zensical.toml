# Zensical configuration for the coffeepot wiki.
#
# The wiki content lives at the repository root (README.md, glossary.md, ctr/,
# nx/), so the docs directory is the project root itself and the rendered site
# is written to site/.

[project]
site_name = "Coffeepot"
site_description = "How Nintendo consoles work: the hardware, the software, and how to write homebrew for them."
site_author = "Coffeepot contributors"
site_url = "https://estyseesghosts.github.io/coffeepot/"

repo_url = "https://github.com/estyseesghosts/coffeepot"
repo_name = "estyseesghosts/coffeepot"
edit_uri = "edit/main/"

# The wiki *is* the repository, so the docs directory is the project root.
docs_dir = "."
site_dir = "site"

# Everything that is not a wiki page. Patterns follow .gitignore syntax and are
# relative to the docs directory (the repository root).
exclude_docs = """
# Generated site output
site/
.cache/

# Repository plumbing, not wiki pages
.github/
.git/
zensical.toml
.gitattributes
.gitignore
tests/

# Vendored third-party trees, not ours
private_please_gitignore/

# Benchmark build artefacts. The sources, Makefiles and READMEs are kept,
# because pages link to them.
ctr/benchmarks/.gitignore
ctr/benchmarks/*/build/
ctr/benchmarks/*/*.3dsx
ctr/benchmarks/*/*.elf
ctr/benchmarks/*/*.smdh
"""

